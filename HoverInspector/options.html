<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hover Inspector options</title>
  <style>
    body { margin: 0; padding: 16px 20px; min-width: 340px; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; color: #202124; }
    h2 { margin: 0 0 4px; font-size: 14px; }
    p { margin: 0 0 12px; color: #5f6368; font-size: 13px; }
    fieldset { margin: 0 0 16px; padding: 0; border: 0; }
    label { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .note { font-size: 12px; color: #5f6368; }
    #saved { color: #1e8e3e; font-size: 12px; visibility: hidden; }
    @media (prefers-color-scheme: dark) {
      body { background: #202124; color: #e8eaed; }
      p, .note { color: #9aa0a6; }
      #saved { color: #81c995; }
    }
  </style>
</head>
<body>
  <fieldset>
    <h2>Status</h2>
    <label><input type="checkbox" id="enabled"> Inspector is on</label>
    <p>You can also turn it on or off by clicking the toolbar icon.</p>
  </fieldset>
  <fieldset>
    <h2>Key to hold while hovering</h2>
    <label><input type="radio" name="modifier" value="Control"> Ctrl</label>
    <label><input type="radio" name="modifier" value="Shift"> Shift</label>
    <label><input type="radio" name="modifier" value="Alt"> Alt <span class="note">(on Windows, a quick Alt tap can focus Chrome's menu)</span></label>
    <label><input type="radio" name="modifier" value="Meta"> Cmd (Mac) / Windows key</label>
  </fieldset>
  <span id="saved">Saved</span>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
